<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B6A80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chat CMP">
<title>Chat CMP</title>
<style>
:root{
  --chat-bg:#F3F0E8; --dot:rgba(11,106,128,.07);
  --head-bg:#0B6A80; --head-fg:#FFFFFF; --head-sub:rgba(255,255,255,.78); --typing:#B9F0F5;
  --in-bg:#FFFFFF; --out-bg:#CDEBF0; --fg:#14211F; --meta:#6C7775; --read:#0B86A0;
  --composer-bg:#ECE8DE; --field-bg:#FFFFFF; --send:#0B6A80; --send-fg:#FFFFFF;
  --sep-bg:rgba(255,255,255,.9);
  --ed-bg:#F4F2EC; --ed-card:#FFFFFF; --ed-line:#DDD8CC; --ed-fg:#14211F; --ed-sub:#5F6A68; --accent:#0B6A80; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chat-bg:#0E141B; --dot:rgba(160,190,230,.05);
    --head-bg:#17212C; --head-fg:#E8EEF5; --head-sub:rgba(232,238,245,.62); --typing:#7FB8F5;
    --in-bg:#1D2733; --out-bg:#24406B; --fg:#E8EEF5; --meta:#8D99A8; --read:#6FB0FF;
    --composer-bg:#141C25; --field-bg:#1D2733; --send:#3D6FB8; --send-fg:#FFFFFF;
    --sep-bg:rgba(29,39,51,.92);
    --ed-bg:#10161D; --ed-card:#1A232D; --ed-line:#2B3642; --ed-fg:#E8EEF5; --ed-sub:#97A3B1; --accent:#6FA4E8; --danger:#F2867E;
  }
}
:root[data-theme="dark"]{
  --chat-bg:#0E141B; --dot:rgba(160,190,230,.05);
  --head-bg:#17212C; --head-fg:#E8EEF5; --head-sub:rgba(232,238,245,.62); --typing:#7FB8F5;
  --in-bg:#1D2733; --out-bg:#24406B; --fg:#E8EEF5; --meta:#8D99A8; --read:#6FB0FF;
  --composer-bg:#141C25; --field-bg:#1D2733; --send:#3D6FB8; --send-fg:#FFFFFF;
  --sep-bg:rgba(29,39,51,.92);
  --ed-bg:#10161D; --ed-card:#1A232D; --ed-line:#2B3642; --ed-fg:#E8EEF5; --ed-sub:#97A3B1; --accent:#6FA4E8; --danger:#F2867E;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--composer-bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}

/* ---------- chat ---------- */
#app{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;background:var(--chat-bg)}
.statusbar[hidden]{display:none}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top,0px)) 18px 4px;background:var(--head-bg);color:var(--head-fg);font-size:14px;font-weight:600;letter-spacing:.01em}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.chat-head{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 2px;background:var(--head-bg);color:var(--head-fg);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app.no-sb .chat-head{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.back{width:34px;height:40px;display:grid;place-items:center}
.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:#5B7FB0;color:#fff;font-weight:600;font-size:16px;touch-action:none}
.avatar img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.who{flex:1;min-width:0;padding:2px 4px;touch-action:none}
.who .name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:13px;color:var(--head-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.who .sub.typing{color:var(--typing)}
.head-icons{display:flex;gap:2px}
.head-icons span{width:40px;height:40px;display:grid;place-items:center}

#msgs{flex:1;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;padding:10px 10px 6px;
  background-color:var(--chat-bg);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px),radial-gradient(var(--dot) 1.2px,transparent 1.3px);
  background-size:22px 22px;background-position:0 0,11px 11px}
.sep{margin-top:auto!important;display:flex;justify-content:center;margin:6px 0 10px}
.sep span{background:var(--sep-bg);color:var(--meta);font-size:12.5px;padding:5px 12px;border-radius:8px}
.row{display:flex;margin-top:2px}
.row.first{margin-top:8px}
.row.out{justify-content:flex-end}
.bubble{max-width:80%;padding:6px 8px 5px 10px;border-radius:12px;font-size:16px;line-height:1.32;color:var(--fg);box-shadow:0 1px .5px rgba(0,0,0,.13);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.row.in .bubble{background:var(--in-bg)}
.row.out .bubble{background:var(--out-bg)}
.row.in.first .bubble{border-top-left-radius:3px}
.row.out.first .bubble{border-top-right-radius:3px}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;margin:6px 0 -3px 10px;font-size:11.5px;color:var(--meta);white-space:nowrap}
.tick{color:var(--meta)}
.tick.read{color:var(--read)}
.bubble.media{padding:3px;width:72%;max-width:300px}
.mwrap{position:relative;border-radius:9px;overflow:hidden;background:rgba(0,0,0,.08)}
.mwrap img{display:block;width:100%;max-height:380px;object-fit:cover}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.dur{position:absolute;left:8px;bottom:6px;display:flex;align-items:center;gap:4px;color:#fff;font-size:12.5px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cap{padding:4px 6px 2px 7px;overflow:hidden}
.cap .meta{margin-top:4px}
.thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--ed-line)}
.media-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.typing-row .bubble{padding:11px 14px;display:flex;gap:5px}
.typing-row i{width:7px;height:7px;border-radius:50%;background:var(--meta);opacity:.4;animation:blink 1.2s infinite}
.typing-row i:nth-child(2){animation-delay:.2s}.typing-row i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion: reduce){.typing-row i{animation:none;opacity:.7}}
.row.new{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.row.new{animation:none}}

.composer{display:flex;align-items:flex-end;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--composer-bg)}
.field{flex:1;display:flex;align-items:flex-end;background:var(--field-bg);border-radius:22px;padding:0 6px;min-height:44px}
.field span{width:34px;height:44px;display:grid;place-items:center;color:var(--meta);flex:none}
#input{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--fg);font:inherit;font-size:16px;line-height:1.3;padding:12px 4px;max-height:120px}
#input::placeholder{color:var(--meta)}
#send{width:46px;height:46px;border-radius:50%;background:var(--send);color:var(--send-fg);display:grid;place-items:center;flex:none}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;background:var(--ed-bg);color:var(--ed-fg);overflow-y:auto;z-index:10;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(96px + env(safe-area-inset-bottom,0px))}
#editor[hidden]{display:none}
.ed-wrap{max-width:620px;margin:0 auto}
#editor h1{font-size:22px;margin:6px 0 4px}
#editor .hint{color:var(--ed-sub);font-size:14px;line-height:1.45;margin:0 0 18px}
#editor h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--ed-card);border:1px solid var(--ed-line);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ed-sub);min-width:0}
label.f.wide{grid-column:1/-1}
#editor input[type=text],#editor input[type=number],#editor select,#editor textarea{font:inherit;font-size:16px;color:var(--ed-fg);background:var(--ed-bg);border:1px solid var(--ed-line);border-radius:8px;padding:8px 10px;width:100%}
#editor textarea{resize:vertical;min-height:44px}
label.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ed-fg)}
label.chk input{width:20px;height:20px}
.step-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.step-n{font-weight:600;font-size:14px;min-width:22px;color:var(--ed-sub)}
.step-head select{flex:1}
.mini{width:36px;height:36px;border:1px solid var(--ed-line);border-radius:8px;display:grid;place-items:center;font-size:16px;flex:none}
.mini.del{color:var(--danger)}
.wait-note{font-size:14px;color:var(--ed-sub);margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ed-line);background:var(--ed-card);font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.photo-row{display:flex;align-items:center;gap:12px}
.photo-row .avatar{width:56px;height:56px}
.btn.hold{position:relative;overflow:hidden;width:100%;border-color:var(--danger);color:var(--danger);font-weight:600;padding:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.btn.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--danger);opacity:.18}
.btn.hold.on .fill{width:100%;transition:width 2s linear}
.btn.hold .lbl{position:relative}
.ed-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ed-card);border-top:1px solid var(--ed-line);display:flex;gap:10px;justify-content:center}
.ed-bar .btn{flex:1;max-width:300px;padding:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- dark web ---------- */
.d-web,.anon,.cur{display:none}
:root[data-theme="darkweb"]{
  --chat-bg:#000; --dot:transparent;
  --head-bg:#000; --head-fg:#FFFFFF; --head-sub:#8C8C8C; --typing:#FFFFFF;
  --in-bg:transparent; --out-bg:transparent; --fg:#FFFFFF; --meta:#7A7A7A; --read:#FFFFFF;
  --composer-bg:#000; --field-bg:#0B0B0B; --send:#FFFFFF; --send-fg:#000;
  --sep-bg:transparent;
  --ed-bg:#000; --ed-card:#0B0B0B; --ed-line:#2A2A2A; --ed-fg:#FFFFFF; --ed-sub:#8C8C8C; --accent:#FFFFFF; --danger:#FF6B6B;
}
:root[data-theme="darkweb"] #app{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
:root[data-theme="darkweb"] .chat-head{border-bottom:1px solid #222}
:root[data-theme="darkweb"] .head-icons span:not(:last-child){display:none}
:root[data-theme="darkweb"] .avatar{background:#000;border:1px solid #555;border-radius:4px}
:root[data-theme="darkweb"] .avatar>:not(.anon){display:none}
:root[data-theme="darkweb"] .avatar .anon{display:grid;place-items:center;width:100%;height:100%;color:#BDBDBD}
:root[data-theme="darkweb"] .d-norm{display:none}
:root[data-theme="darkweb"] .d-web{display:inline}
:root[data-theme="darkweb"] .sep span{color:#7A7A7A;font-size:12px;letter-spacing:.04em;padding:4px 0;border-radius:0}
:root[data-theme="darkweb"] .sep>span{border-top:1px dashed #333;border-bottom:1px dashed #333}
:root[data-theme="darkweb"] .row,:root[data-theme="darkweb"] .row.out{justify-content:flex-start}
:root[data-theme="darkweb"] .row{margin-top:6px}
:root[data-theme="darkweb"] .bubble{max-width:100%;width:100%;box-shadow:none;border-radius:0;padding:2px 0;font-size:15px;line-height:1.4}
:root[data-theme="darkweb"] .bubble::before{content:attr(data-who) "> ";color:#8C8C8C}
:root[data-theme="darkweb"] .row.out .bubble::before{color:#FFFFFF}
:root[data-theme="darkweb"] .meta{font-size:11px;float:none;margin:0 0 0 10px}
:root[data-theme="darkweb"] .bubble.media{width:100%;max-width:100%;padding:2px 0}
:root[data-theme="darkweb"] .bubble.media::before{display:block;margin-bottom:4px}
:root[data-theme="darkweb"] .mwrap{border:1px solid #333;border-radius:2px;max-width:280px}
:root[data-theme="darkweb"] .cap{padding:4px 0 0}
:root[data-theme="darkweb"] .typing-row .bubble i{display:none}
:root[data-theme="darkweb"] .typing-row .bubble{padding:2px 0}
:root[data-theme="darkweb"] .typing-row .cur{display:inline-block;width:9px;height:17px;background:#FFFFFF;vertical-align:-3px;animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
:root[data-theme="darkweb"] .field{border:1px solid #333;border-radius:4px}
:root[data-theme="darkweb"] #send{border-radius:4px}
:root[data-theme="darkweb"] .composer{border-top:1px solid #222}
:root[data-theme="darkweb"] .btn.primary{color:#000}
</style>
</head>

      <span aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 14.5c1 1.3 2.4 2 4 2s3-.7 4-2"/><circle cx="9" cy="9.8" r=".6" fill="currentColor"/><circle cx="15" cy="9.8" r=".6" fill="currentColor"/></svg></span>

let takeStart=Date.now();
function clock(){
  const st=(cfg.scene.start||'').trim();const m=st.match(/^(\d{1,2}):(\d{2})$/);
  let d;
  if(m){d=new Date();d.setHours(+m[1],+m[2],0,0);d=new Date(d.getTime()+(Date.now()-takeStart));}
  else d=new Date();
  const h=d.getHours(),mi=String(d.getMinutes()).padStart(2,'0');
  if(cfg.scene.fmt==='24')return String(h).padStart(2,'0')+':'+mi;
  return (h%12||12)+':'+mi+(h<12?' a.m.':' p.m.');
}

/* ---------- sound ---------- */
let actx=null;
function unlockAudio(){
  try{
    if(navigator.audioSession)navigator.audioSession.type='playback';
    if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A();}
    if(actx&&actx.state!=='running')actx.resume();
    if(actx&&!actx._primed){const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);actx._primed=true;}
  }catch(e){}
}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true,capture:true}));
function withAudio(fn){if(!actx)return;if(actx.state!=='running'){actx.resume().then(fn).catch(()=>{});}else fn();}
function popOut(){
  if(cfg.scene.soundOut===false)return;
  unlockAudio();
  withAudio(()=>{try{const t=actx.currentTime+.01,os=actx.createOscillator(),g=actx.createGain();os.type='triangle';os.frequency.setValueAtTime(380,t);os.frequency.exponentialRampToValueAtTime(1050,t+.09);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.45,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.16);os.connect(g).connect(actx.destination);os.start(t);os.stop(t+.18);}catch(e){}});
}
function blip(){
  if(!cfg.scene.sound||!actx)return;
  withAudio(()=>{try{const t=actx.currentTime;[[880,0],[1320,.09]].forEach(([f,o])=>{const os=actx.createOscillator(),g=actx.createGain();os.type='sine';os.frequency.value=f;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.18,t+o+.01);g.gain.exponentialRampToValueAtTime(.001,t+o+.16);os.connect(g).connect(actx.destination);os.start(t+o);os.stop(t+o+.18);});}catch(e){}});
}

let gen=0,idx=0,waiting=false;
function later(g,sec,fn){setTimeout(()=>{if(g===gen)fn()},Math.max(0,+sec||0)*1000)}
function startTake(){
  gen++;const g=gen;

  takeStart=Date.now();renderHeader();
  const sep=document.createElement('div');sep.className='sep';sep.innerHTML='<span><span class="d-norm">Hoy</span><span class="d-web">sesión cifrada · los mensajes se autodestruyen</span></span>';msgs.appendChild(sep);

  idx=0;waiting=false;
  later(g,cfg.scene.lead,()=>next(g));
}
function next(g){
  const s=cfg.steps[idx];if(!s)return;
  if(s.type==='wait'){waiting=true;return;}
  later(g,s.delay,()=>{
    markRead();
    const deliver=()=>{setTyping(false);addMsg('in',s.text||'',clock(),true,s);blip();idx++;next(g);};
    if((+s.typing||0)>0){setTyping(true);later(g,s.typing,deliver);}else deliver();
  });
}
function send(){
  const t=input.value.replace(/\s+$/,'');if(!t.trim())return;

  const g=gen;later(g,.8,()=>{if(row.dataset.tick==='sent')setTick(row,'delivered')});
  if(waiting){waiting=false;idx++;next(g);}
}

    '<select data-k="s.'+i+'.type" aria-label="Tipo de paso"><option value="in"'+(s.type==='in'?' selected':'')+'>Mensaje entrante</option><option value="wait"'+(s.type==='wait'?' selected':'')+'>Esperar respuesta del actor</option></select>'+
    '<button class="mini" data-act="up" data-i="'+i+'" aria-label="Subir"'+(i===0?' disabled':'')+'>↑</button>'+
    '<button class="mini" data-act="down" data-i="'+i+'" aria-label="Bajar"'+(i===n-1?' disabled':'')+'>↓</button>'+
    '<button class="mini del" data-act="del-s" data-i="'+i+'" aria-label="Borrar paso">✕</button></div>';
  if(s.type==='wait')h+='<p class="wait-note">El guion se detiene hasta que el actor envíe un mensaje. La espera del paso siguiente empieza a contar desde ese envío.</p>';
  else h+='<div class="grid"><label class="f wide">Texto (opcional si lleva imagen)<textarea rows="2" data-k="s.'+i+'.text">'+esc(s.text)+'</textarea></label>'+
    '<label class="f">Espera antes (s)<input type="number" inputmode="decimal" min="0" step="0.5" data-k="s.'+i+'.delay" value="'+esc(s.delay??0)+'"></label>'+
    '<label class="f">Escribiendo (s)<input type="number" inputmode="decimal" min="0" step="0.5" data-k="s.'+i+'.typing" value="'+esc(s.typing??0)+'"></label>'+mediaEd(s,'s.'+i)+'</div>';
  return h+'</div>';
}
function histHTML(h,i){
  return '<div class="card"><div class="step-head"><span class="step-n">'+(i+1)+'</span>'+
    '<select data-k="h.'+i+'.from" aria-label="Quién lo envía"><option value="in"'+(h.from!=='out'?' selected':'')+'>Contacto</option><option value="out"'+(h.from==='out'?' selected':'')+'>Actor</option></select>'+
    '<button class="mini del" data-act="del-h" data-i="'+i+'" aria-label="Borrar mensaje">✕</button></div>'+
    '<div class="grid"><label class="f wide">Texto<textarea rows="2" data-k="h.'+i+'.text">'+esc(h.text)+'</textarea></label>'+
    '<label class="f">Hora que se muestra<input type="text" data-k="h.'+i+'.time" value="'+esc(h.time)+'"></label>'+mediaEd(h,'h.'+i)+'</div></div>';
}
function canFull(){const r=document.documentElement;const standalone=window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);return !standalone&&!!(r.requestFullscreen||r.webkitRequestFullscreen)&&document.fullscreenEnabled!==false;}
function renderEditor(){
  const c=cfg.contact,sc=cfg.scene;saveNow();
  editor.innerHTML='<div class="ed-wrap">'+(storageOK?'':'<div class="card" style="border-color:var(--danger);color:var(--danger)">Este navegador no está guardando los cambios (puede ser modo privado o incógnito). Ábrela en una ventana normal o desde el ícono de pantalla de inicio.</div>')+
  '<div class="btns" style="margin-bottom:12px"><button class="btn primary" data-act="start">Iniciar chat</button><button class="btn" data-act="close">Volver al chat</button></div><h1>Guion del chat</h1><p class="hint">Durante el chat, mantén presionada la foto o el nombre del contacto (arriba, en el encabezado) para regresar a este menú. Para repetir la escena desde el principio, toca Iniciar chat. Todo se guarda en este teléfono.</p>'+
  '<h2>Contacto</h2><div class="card"><div class="grid">'+
    '<div class="photo-row" style="grid-column:1/-1"><div class="avatar">'+avatarHTML()+'</div><div class="btns"><label class="btn">Elegir foto<input type="file" accept="image/*" data-act="photo" hidden></label>'+(c.photo?'<button class="btn" data-act="photo-clear">Quitar foto</button>':'')+'</div></div>'+
    '<label class="f">Nombre<input type="text" data-k="contact.name" value="'+esc(c.name)+'"></label>'+
    '<label class="f">Estado<input type="text" data-k="contact.status" value="'+esc(c.status)+'" placeholder="en línea"></label>'+
    (sc.theme==='darkweb'?'<label class="f" style="grid-column:1/-1">Estado en modo dark web<input type="text" data-k="contact.dwStatus" value="'+esc(c.dwStatus??'conexión cifrada')+'"></label>'+
      '<label class="f" style="grid-column:1/-1">Nombre del dueño del teléfono (solo dark web)<input type="text" data-k="contact.dwOwner" value="'+esc(c.dwOwner||'')+'" placeholder="tú"></label>':'')+
  '</div></div>'+
  '<h2>Escena</h2><div class="card"><div class="grid">'+
    '<label class="f">Hora de la escena (HH:MM)<input type="text" inputmode="numeric" data-k="scene.start" value="'+esc(sc.start)+'" placeholder="vacío = hora real"></label>'+
    '<label class="f">Formato de hora<select data-k="scene.fmt"><option value="12"'+(sc.fmt!=='24'?' selected':'')+'>12 h (p.m.)</option><option value="24"'+(sc.fmt==='24'?' selected':'')+'>24 h</option></select></label>'+
    '<label class="f">Tema<select data-k="scene.theme"><option value="auto"'+(sc.theme==='auto'?' selected':'')+'>Como el teléfono</option><option value="light"'+(sc.theme==='light'?' selected':'')+'>Claro</option><option value="dark"'+(sc.theme==='dark'?' selected':'')+'>Oscuro</option><option value="darkweb"'+(sc.theme==='darkweb'?' selected':'')+'>Dark web</option></select></label>'+
    '<label class="f">Pausa al iniciar la toma (s)<input type="number" inputmode="decimal" min="0" step="0.5" data-k="scene.lead" value="'+esc(sc.lead)+'"></label>'+
    '<label class="chk" style="grid-column:1/-1"><input type="checkbox" data-k="scene.sound"'+(sc.sound?' checked':'')+'>Sonido al recibir mensaje</label>'+
    '<label class="chk" style="grid-column:1/-1"><input type="checkbox" data-k="scene.soundOut"'+(sc.soundOut!==false?' checked':'')+'>Sonido al enviar mensaje</label>'+
    '<label class="chk" style="grid-column:1/-1"><input type="checkbox" data-k="scene.statusbar"'+(sc.statusbar?' checked':'')+'>Barra de estado simulada (hora, señal, batería)</label>'+
  '</div></div>'+
  '<h2>Conversación previa</h2><p class="hint" style="margin-bottom:10px">Mensajes que ya están en pantalla al empezar la toma.</p>'+
  cfg.history.map(histHTML).join('')+
  '<div class="btns"><button class="btn" data-act="add-h">Agregar mensaje previo</button></div>'+
  '<h2>Guion de la toma</h2><p class="hint" style="margin-bottom:10px">Los pasos corren en orden. La espera cuenta desde el mensaje anterior; el tiempo de escribiendo se suma después.</p>'+
  cfg.steps.map(stepHTML).join('')+
  '<div class="btns"><button class="btn" data-act="add-in">Agregar mensaje entrante</button><button class="btn" data-act="add-wait">Agregar espera del actor</button></div>'+
  (canFull()?'<h2>Pantalla</h2><div class="btns"><button class="btn" data-act="full">Pantalla completa</button></div>':'')+
  '<div class="btns" style="margin-top:22px;justify-content:center"><button class="btn primary" data-act="start">Iniciar chat</button></div>'+
  '<div style="height:140px"></div><hr style="border:0;border-top:1px solid var(--ed-line);margin:0 0 18px">'+
  '<p class="hint" style="margin:0 0 4px;text-align:center">Versión 18 · actualizada el 5 oct 2026, 10:00<br><span id="upl">'+esc(uplText)+'</span></p>'+
  '<h2>Restablecer</h2><div class="card"><p class="wait-note" style="margin-bottom:10px">Borra todo lo que configuraste en este teléfono (contacto, foto, imágenes, conversación previa y guion de la toma) y regresa al ejemplo original. No se puede deshacer.</p>'+
  '<button class="btn hold" data-hold="reset"><span class="fill"></span><span class="lbl">Mantén presionado para restablecer</span></button></div><div style="height:60px"></div>'+
  '</div><div class="ed-bar"><button class="btn" data-act="close">Volver al chat</button><button class="btn primary" data-act="start">Iniciar chat</button></div>';
}
function setPath(k,v){
  const p=k.split('.');
  if(p[0]==='s'||p[0]==='h'){const arr=p[0]==='s'?cfg.steps:cfg.history;arr[+p[1]][p[2]]=v;}
  else cfg[p[0]][p[1]]=v;
}
editor.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.k;if(!k)return;
  let v=el.type==='checkbox'?el.checked:el.type==='number'?(parseFloat(el.value)||0):el.value;
  setPath(k,v);save();
  if(k==='scene.theme')applyTheme();
  if(k==='contact.name'&&!cfg.contact.photo){const a=editor.querySelector('.photo-row .avatar');if(a)a.textContent=initials(v);}
});
editor.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.k&&!/^s\.\d+\.type$/.test(el.dataset.k)){const k=el.dataset.k;setPath(k,el.type==='checkbox'?el.checked:el.type==='number'?(parseFloat(el.value)||0):el.value);save();if(k==='scene.theme'){applyTheme();renderHeader();renderEditor();}if(/\.video$/.test(k))renderEditor();}
  if(el.dataset.k&&/^s\.\d+\.type$/.test(el.dataset.k)){const s=cfg.steps[+el.dataset.k.split('.')[1]];if(s.type==='in'){s.text=s.text||'';s.delay=s.delay??2;s.typing=s.typing??2;}save();renderEditor();}
  if(el.dataset.act==='img'&&el.files&&el.files[0]){
    const t=el.dataset.t.split('.'),obj=(t[0]==='s'?cfg.steps:cfg.history)[+t[1]];
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const M=1000,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);obj.img=c.toDataURL('image/jpeg',.82);save();if(!storageOK){delete obj.img;save();alert('No hay espacio para guardar esta imagen. Prueba con menos imágenes.');}renderEditor();};img.src=fr.result;};
    fr.readAsDataURL(el.files[0]);
  }
  if(el.dataset.act==='photo'&&el.files&&el.files[0]){
    const f=el.files[0],fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const S=256,c=document.createElement('canvas');c.width=c.height=S;const s=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);cfg.contact.photo=c.toDataURL('image/jpeg',.85);save();renderEditor();};img.src=fr.result;};
    fr.readAsDataURL(f);
  }
});
editor.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.dataset.act==='photo'||b.dataset.act==='img')return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==='add-in')cfg.steps.push({type:'in',text:'',delay:2,typing:2});
  else if(a==='add-wait')cfg.steps.push({type:'wait'});
  else if(a==='add-h')cfg.history.push({from:'in',text:'',time:''});
  else if(a==='del-s')cfg.steps.splice(i,1);
  else if(a==='del-h')cfg.history.splice(i,1);
  else if(a==='up'&&i>0)[cfg.steps[i-1],cfg.steps[i]]=[cfg.steps[i],cfg.steps[i-1]];
  else if(a==='down'&&i<cfg.steps.length-1)[cfg.steps[i+1],cfg.steps[i]]=[cfg.steps[i],cfg.steps[i+1]];
  else if(a==='photo-clear')cfg.contact.photo='';
  else if(a==='img-clear'){const t=b.dataset.t.split('.'),o=(t[0]==='s'?cfg.steps:cfg.history)[+t[1]];delete o.img;delete o.video;delete o.dur;}
  else if(a==='full'){try{const r=document.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen).call(r);}catch(err){b.textContent='Este navegador no permite pantalla completa';}return;}
  else if(a==='close'){closeEditor(false);return;}
  else if(a==='start'){unlockAudio();closeEditor(true);return;}
  else return;
  save();renderEditor();
});
let uplText='Subida a GitHub: consultando…';
(function(){
  const m=location.hostname.match(/^([^.]+)\.github\.io$/),repo=location.pathname.split('/').filter(Boolean)[0];
  if(!m||!repo){uplText='';return;}
  fetch('https://api.github.com/repos/'+m[1]+'/'+repo+'/commits?per_page=1').then(r=>r.json()).then(d=>{
    const t=new Date(d[0].commit.committer.date);
    uplText='Subida a GitHub: '+t.toLocaleString('es-MX',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }).catch(()=>{uplText='Subida a GitHub: sin conexión';}).finally(()=>{const e=document.getElementById('upl');if(e)e.textContent=uplText;});
})();
(function(){
  let t=null,btn=null;
  const stop=()=>{clearTimeout(t);t=null;if(btn){btn.classList.remove('on');btn=null;}};
  editor.addEventListener('pointerdown',e=>{
    const b=e.target.closest('[data-hold]');if(!b)return;
    e.preventDefault();btn=b;b.classList.add('on');
    t=setTimeout(()=>{t=null;cfg=clone(DEFAULT);saveNow();applyTheme();renderEditor();editor.scrollTop=0;},2000);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>editor.addEventListener(ev,stop,true));
  editor.addEventListener('contextmenu',e=>{if(e.target.closest('[data-hold]'))e.preventDefault();});
})();
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
function openEditor(){input.blur();renderEditor();editor.hidden=false;editor.scrollTop=0;}
function closeEditor(start){editor.hidden=true;try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}renderHeader();keepAwake();if(start)startTake();}

/* ---------- boot ---------- */
applyTheme();updateSendIcon();renderHeader();fitViewport();
openEditor();
})();
</script>
</body>
